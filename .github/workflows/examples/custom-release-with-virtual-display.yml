name: Example - Custom Release with Virtual Display

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number in major.minor.patch format'
        required: true
        type: string

jobs:
  # Use the standard validation job
  validate_version:
    name: Validate version number
    uses: ./.github/workflows/validate-version-job.yml
    with:
      version: ${{ inputs.version }}
      ref_name: ${{ github.ref_name }}

  # Use the standard matrix building job
  configure_test_matrix:
    name: Build release test matrix
    uses: ./.github/workflows/configure-matrix-job.yml
    with:
      needs_python: true

  # Custom test job with virtual display setup
  test:
    name: Run MATLAB tests with virtual display (${{ matrix.MATLABVersion }})
    needs: [validate_version, configure_test_matrix]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.configure_test_matrix.outputs.matrix) }}

    steps:
      # Checks-out the repository under $GITHUB_WORKSPACE, so the job can access it
      - name: Checkout repository
        uses: actions/checkout@v4

      # Custom step: Setup virtual display
      - name: Setup virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          echo "DISPLAY=:99.0" >> $GITHUB_ENV
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          sleep 3

      # Custom step: Install additional dependencies
      - name: Install additional system dependencies
        run: |
          sudo apt-get install -y libgl1-mesa-glx libglib2.0-0

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.pythonVersion }}

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: ${{ matrix.MATLABVersion }}

      - name: Install MatBox
        uses: ehennestad/matbox-actions/install-matbox@v1

      # Custom step: Verify display is working
      - name: Verify virtual display
        run: |
          echo "DISPLAY is set to: $DISPLAY"
          xdpyinfo -display :99.0 | head -10

      # Runs all tests in the project with virtual display
      - name: Run tests
        uses: ehennestad/matbox-actions/test-code@v1
        with:
          source_directory: code
          tools_directory: tools
          report_subdirectory: ${{ matrix.MATLABVersion }}
          create_badge: false

      # Save the contents of the report directory from each release into an artifact.
      - name: Save report directory
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.MATLABVersion }}
          path: docs/reports

  # Use the standard packaging job
  release:
    name: Package toolbox and create draft release
    needs: [test, validate_version]
    uses: ./.github/workflows/package-toolbox-job.yml
    with:
      version_number: ${{ needs.validate_version.outputs.version_number }}
    secrets:
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}

  # Use the standard verification job
  verify_installation:
    name: Verify toolbox installation
    needs: [release, validate_version]
    uses: ./.github/workflows/verify-installation-job.yml
    with:
      toolbox_name: ${{ needs.release.outputs.toolbox_name }}
