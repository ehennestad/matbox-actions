name: Run tests

on:
  workflow_call:
    inputs:
      matbox_version:
        description: MatBox version to install ("latest" or a specific version like "0.9.10").
        type: string
        default: 'latest'
      source_directory:
        description: Path to the directory containing code. Code coverage and code analysis will run on the contents of this folder and its subfolders.
        type: string
        default: 'src'
      tests_directory:
        type: string
        default: 'tests'
        description: 'Directory containing MATLAB test suites'
      tools_directory:
        description: Path to the directory containing CI tools or tests. Used for locating unit tests and running customized MatBox tasks.
        type: string
        default: 'tools'
      matlab_release:
        description: MATLAB release to use for running test suites and code analysis.
        type: string
        default: 'latest'
      matlab_use_cache:
        description: Whether to cache the MATLAB installation for faster subsequent setups.
        type: boolean
        default: false
      matlab_products:
        description: Optional list of MATLAB products to install.
        type: string
        default: ''
      needs_virtual_display:
        description: Whether to install virtual display for testing.
        type: boolean
        default: false
      update_badges:
        description: Whether push events and ready pull requests should generate and commit badge updates.
        type: boolean
        default: true
    outputs:
      badges_stale:
        description: Whether generated badge files differ from committed badge files.
        value: ${{ jobs.test.outputs.badges_stale }}

    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  # This workflow contains a single job called "test"
  test:
    name: Test toolbox code
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    outputs:
      badges_stale: ${{ steps.check_badges.outputs.badges_stale }}
    env: # Assign secret to env to be able to use it in "if:" conditional below
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      SHOULD_CREATE_BADGES: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && !github.event.pull_request.draft) }}
      SHOULD_PUSH_BADGES: ${{ inputs.update_badges && (github.event_name == 'push' || (github.event_name == 'pull_request' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)) }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      
      - name: Check out repository
        uses: actions/checkout@v6

      # Install the virtual display before installing MATLAB
      - name: Start virtual display server
        if: ${{ inputs.needs_virtual_display }}
        run: |
          sudo apt-get install -y xvfb
          Xvfb :99 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Set up MATLAB (${{ inputs.matlab_release }})
        uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ inputs.matlab_release }}
          cache: ${{ inputs.matlab_use_cache }}
          products: ${{ inputs.matlab_products }}

      - name: Install MatBox
        uses: ehennestad/matbox-actions/install-matbox@main
        with:
          version: ${{ inputs.matbox_version }}

      - name: Check code and upload report
        uses: ehennestad/matbox-actions/check-code@main
        with:
          source_directory: ${{ inputs.source_directory }}
          tools_directory: ${{ inputs.tools_directory }}
          create_badge: ${{ env.SHOULD_CREATE_BADGES }}
      
      - name: Run tests
        uses: ehennestad/matbox-actions/test-code@main
        with:
          source_directory: ${{ inputs.source_directory }}
          tests_directory: ${{ inputs.tests_directory }}
          tools_directory: ${{ inputs.tools_directory }}
          create_badge: ${{ env.SHOULD_CREATE_BADGES }}

      - name: Check whether generated badges are stale
        id: check_badges
        if: always()
        shell: bash
        run: |
          if [[ "$SHOULD_CREATE_BADGES" != "true" ]]; then
            echo "badges_stale=false" >> "$GITHUB_OUTPUT"
            echo "Badge generation is disabled for this event."
            exit 0
          fi

          if [[ -n "$(git status --porcelain -- .github/badges)" ]]; then
            echo "badges_stale=true" >> "$GITHUB_OUTPUT"
            echo "Generated badges differ from committed badges:"
            git status --short -- .github/badges
          else
            echo "badges_stale=false" >> "$GITHUB_OUTPUT"
            echo "Generated badges match committed badges."
          fi

      - name: Commit SVG badges if updated
        if: ${{ env.SHOULD_PUSH_BADGES == 'true' }}
        uses: ehennestad/matbox-actions/push-badges@main
        with:
          pr-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          pr-repo: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Upload code coverage report to Codecov
        uses: codecov/codecov-action@v6
        if: ${{ env.CODECOV_TOKEN != '' }}
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: docs/reports/codecoverage.xml

      - name: Save reports directory
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: docs/reports

  badges_current:
    name: Badges current
    needs: test
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check badge freshness
        shell: bash
        run: |
          if [[ "${{ github.event.pull_request.draft }}" == "true" ]]; then
            echo "Draft pull requests do not require badge updates."
            exit 0
          fi

          if [[ "${{ inputs.update_badges }}" == "true" && "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.repository }}" ]]; then
            echo "Badge updates are enabled for this pull request."
            exit 0
          fi

          if [[ "${{ needs.test.outputs.badges_stale }}" == "true" ]]; then
            echo "::error::Generated badges differ from committed badges. Commit updated badge files before merging, or enable update_badges for this workflow."
            exit 1
          fi

          echo "Committed badges are current."
