name: Build test matrix

# Build matrix variables for running tests across different MATLAB releases.
# Will return a json with the following variables:
#   - MATLABVersion
#   - pythonVersion (if needs_python == true)
# The pythonVersion will be the latest compatible python version for each 
# MATLAB release.
# See also:
#   .github/actions/configure-matlab-test-matrix/action.yml

on:
  workflow_call:
    inputs:
      tools_directory:
        type: string
        default: 'tools'
        description: 'Directory containing tools'
      matlab_versions:
        type: string
        default: '[]'
        description: 'JSON array of MATLAB versions to test (optional - will be determined from MLToolboxInfo.json if not provided)'
      python_versions:
        type: string
        default: ''
        description: 'JSON object mapping MATLAB versions to Python versions'
      needs_python:
        type: boolean
        default: false
        description: 'Whether Python is needed for testing (controls if Python versions are included in test matrix)'
    outputs:
      matrix:
        description: 'Test matrix JSON'
        value: ${{ jobs.configure_test_matrix.outputs.matrix }}
      matlab_versions:
        description: 'MATLAB versions array'
        value: ${{ jobs.configure_test_matrix.outputs.matlab_versions }}

jobs:
  configure_test_matrix:
    name: Build release test matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.configure_test_matrix.outputs.matrix }}
      matlab_versions: ${{ steps.configure_test_matrix.outputs.matlab_versions }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check for MLToolboxInfo.json
        run: |
          if [ ! -f "${{ inputs.tools_directory }}/MLToolboxInfo.json" ]; then
            echo "Error: MLToolboxInfo.json not found in ${{ inputs.tools_directory }} directory"
            echo "This file is required for the release workflow to function properly"
            exit 1
          fi
          echo "MLToolboxInfo.json found in ${{ inputs.tools_directory }} directory"

      - name: Build test matrix
        id: configure_test_matrix
        uses: ehennestad/matbox-actions/configure-matlab-test-matrix@main
        with:
          tools_directory: ${{ inputs.tools_directory }}
          matlab_versions: ${{ inputs.matlab_versions }}
          python_versions: ${{ inputs.python_versions }}
          include_python: ${{ inputs.needs_python }}
