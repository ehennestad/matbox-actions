# Note: Codespell reads every setting from the configuration file named by
# the config_file input. It also picks up a .codespellrc in the repository
# root by itself, so config_file is only needed for a configuration file
# kept somewhere else. A path that does not exist is ignored.

name: Run codespell

on:
  workflow_call:
    inputs:
      config_file:
        description: 'Relative path to a codespell config file'
        required: false
        type: string
        default: '.codespellrc'

jobs:
  codespell:
    name: Check for spelling errors
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Codespell
        uses: codespell-project/actions-codespell@v2
        with:
          config: ${{ inputs.config_file }}
