name: Validate version number

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        description: 'Version number in major.minor.patch format (for manual triggers)'
      bump:
        type: string
        required: false
        description: "Bump type ('major', 'minor' or 'patch') used to infer the version from the latest release tag when no explicit version is given (for manual triggers)"
      ref_name:
        type: string
        required: false
        description: 'GitHub ref name (for tag triggers)'
    outputs:
      version_number:
        description: 'Validated version number'
        value: ${{ jobs.validate_version.outputs.version_number }}
      skip_workflow:
        description: 'Whether to skip the workflow'
        value: ${{ jobs.validate_version.outputs.skip_workflow }}

jobs:
  validate_version:
    name: Validate version number
    runs-on: ubuntu-latest
    outputs:
      version_number: ${{ steps.validate.outputs.version_number }}
      skip_workflow: ${{ steps.validate.outputs.skip_workflow }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate version
        id: validate
        uses: ehennestad/matbox-actions/validate-version@v1.6
        with:
          version: ${{ inputs.version }}
          bump: ${{ inputs.bump }}
          ref_name: ${{ inputs.ref_name }}
