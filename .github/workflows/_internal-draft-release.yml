name: Draft release

on:
  push:
    tags:
      - 'v*.*'

permissions:
  contents: write

jobs:
  draft_release:
    name: Create draft release from tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --generate-notes --title "$GITHUB_REF_NAME"
