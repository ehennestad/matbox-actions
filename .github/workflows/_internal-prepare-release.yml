name: Prepare release

# Cut a reproducible release from a workflow_dispatch button.
#
# The whole procedure lives in scripts/prepare-release.sh; this workflow just
# runs it from a clean checkout of main. The script pins the internal action
# refs to the release tag (via scripts/pin-internal-refs.sh) on a commit that
# is tagged but never pushed to main, pushes only the tag, and opens a draft
# release — rolling the tag back if anything fails partway.
#
# Publishing the draft is a human action, so it triggers
# _internal-bump-major-tag, which moves the major tag onto the release commit.
#
# The release commit rewrites every workflow file under .github/workflows
# (pin-internal-refs.sh). GitHub refuses to let the default GITHUB_TOKEN push
# any commit touching .github/workflows, regardless of the permissions
# declared below -- this is a hard restriction, not a config knob. Pushing
# the tag therefore needs a token with the Workflows permission, which only a
# PAT (or GitHub App token) can carry. RELEASE_TAG_TOKEN is a fine-grained
# PAT scoped to this repo only, with Contents: Read and write and
# Workflows: Read and write.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump; the new version is inferred from the latest release tag'
        required: true
        type: choice
        options:
          - minor
          - patch
          - major
        default: minor
      version:
        description: 'Explicit version override, MAJOR.MINOR or MAJOR.MINOR.PATCH (e.g. 1.5 or 1.5.1); takes precedence over bump'
        required: false
        type: string

permissions:
  contents: write

jobs:
  prepare_release:
    name: Pin internal refs and tag release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.RELEASE_TAG_TOKEN }}

      - name: Cut release
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/prepare-release.sh "${VERSION:-$BUMP}"
