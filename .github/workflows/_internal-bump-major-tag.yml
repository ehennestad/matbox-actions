name: Bump major tag

# The major tag is force-moved onto the release commit, which has its
# internal .github/workflows refs pinned to the release tag (see
# scripts/pin-internal-refs.sh). GitHub refuses to let the default
# GITHUB_TOKEN push any ref update that touches .github/workflows content,
# regardless of the permissions declared below -- the same hard restriction
# _internal-prepare-release.yml hits when pushing the release tag itself.
# Reuse RELEASE_TAG_TOKEN (a fine-grained PAT scoped to this repo, with
# Contents: Read and write and Workflows: Read and write) for the checkout.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  bump_major_tag:
    name: Move major tag to published release
    # Skip pre-releases so tags like v1.5-rc1 do not move the floating major tag.
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TAG_TOKEN }}

      - name: Verify internal refs are pinned
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # A release cut outside the Prepare-release tooling (e.g. drafted by
          # hand against main) still has @main internal refs; moving the major
          # tag onto it would point every @v1 consumer at the development tip.
          # The :(glob) pathspec keeps '*' from crossing directories, matching
          # the pin script's scope (consumer-facing examples/ keep @v1 refs).
          if git grep -n "ehennestad/matbox-actions/[^@]*@main" "$RELEASE_TAG" -- ':(glob).github/workflows/*.yml'; then
            echo "::error::${RELEASE_TAG} still has internal refs on @main (shown above). Cut releases via the Prepare release workflow or scripts/prepare-release.sh; not moving the major tag."
            exit 1
          fi

      - name: Move major tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # Derive the major-only tag (e.g. v1.5 -> v1) and force it onto the release commit.
          version="${RELEASE_TAG#v}"
          major="v${version%%.*}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -f "$major" "$RELEASE_TAG"
          git push origin "$major" --force

          echo "Moved $major to $RELEASE_TAG"
