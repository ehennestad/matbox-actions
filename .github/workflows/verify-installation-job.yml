name: Verify toolbox installation

on:
  workflow_call:
    inputs:
      matbox_version:
        description: MatBox version to install ("latest" or a specific version like "0.9.10").
        type: string
        default: 'latest'
      toolbox_name:
        type: string
        required: true
        description: 'Name of the toolbox to verify'
      tools_directory:
        description: Path to the directory containing CI tools.
        type: string
        default: 'tools'
      os_matrix:
        type: string
        default: '["ubuntu-latest", "windows-latest", "macos-latest"]'
        description: 'JSON array of operating systems to test on'

jobs:
  verify_installation:
    name: Verify toolbox installation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os_matrix) }}

    steps:
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3

      - name: Install MatBox
        uses: ehennestad/matbox-actions/install-matbox@v1.5
        with:
          version: ${{ inputs.matbox_version }}

      - name: Download packaged toolbox
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.toolbox_name }}.mltbx

      - name: Install and verify toolbox
        uses: matlab-actions/run-command@v3
        with:
          command: |
            listing = dir(fullfile(pwd, '*.mltbx'));
            toolboxFile = fullfile(listing.folder, listing.name);

            addpath(genpath("${{ inputs.tools_directory }}"));
            fprintf('Toolbox file exists: %d\n', isfile(toolboxFile))
            if exist("verifyToolboxInstallation", "file")
              verifyToolboxInstallation(toolboxFile);
            else
              matbox.tasks.verifyToolboxInstallation(toolboxFile);
            end
