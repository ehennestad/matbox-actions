name: Verify toolbox installation

on:
  workflow_call:
    inputs:
      toolbox_name:
        type: string
        required: true
        description: 'Name of the toolbox to verify'
      tools_directory:
        description: Path to the directory containing CI tools.
        type: string
        default: 'tools'
      os_matrix:
        type: string
        default: '["ubuntu-latest", "windows-latest", "macos-latest"]'
        description: 'JSON array of operating systems to test on'

jobs:
  verify_installation:
    name: Verify toolbox installation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os_matrix) }}

    steps:
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2

      - name: Install MatBox
        uses: ehennestad/matbox-actions/install-matbox@v1

      - name: Download packaged toolbox
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.toolbox_name }}.mltbx

      - name: Install and verify toolbox
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(genpath("${{ inputs.tools_directory }}"));
            toolboxFile = "${{ inputs.toolbox_name }}.mltbx"
            if exist("verifyToolboxInstallation", "file")
              verifyToolboxInstallation(toolboxFile);
            else
              matbox.tasks.verifyToolboxInstallation(toolboxFile);
            end
