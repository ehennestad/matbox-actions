name: Run Codespell

# NB: Codespell finds a .codespellrc in the repository root by itself.
# Set config_file below only for a config file kept somewhere else.

on:
  push:
    branches: [ $default-branch ]
    
  pull_request:
    branches: [ $default-branch ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-codespell:
    name: Run Codespell
    uses: ehennestad/matbox-actions/.github/workflows/codespell-workflow.yml@v1
    # with:
    #   # Path of a codespell config file, relative to the repository root
    #   config_file: .config/codespell.cfg
