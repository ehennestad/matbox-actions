# Should only be used in a job where MATLAB and MatBox is installed in previous steps
# Requires test reports to be available as artifacts

name: 'Generate "tested with" badge'
description: 'Generate the "tested with" badge for a release and push to `gh-badges` branch'

inputs:
  version_number:
    description: 'Version number for the release'
    required: true
  tools_directory:
    description: 'Directory containing badge tools'
    required: false
    default: 'tools'
  reports_directory:
    description: 'Directory containing test reports (not implemented yet)'
    required: false
    default: 'docs/reports'

runs:
  using: "composite"
  steps:
    - name: Download test reports
      uses: actions/download-artifact@v7
      with:
        pattern: reports-*
        path: docs/reports
        merge-multiple: false
      # We are downloading all test reports from a matrix test across multiple 
      # MATLAB releases. The artifacts should be named like "reports-R2022a"
      # so we are retrieving reports across the different MATLAB releases that
      # were tested across. Use "merge-multiple: false" to download each 
      # test-report into a subfolder using the artifact names as subfolder name
    
    - name: Generate "tested with" badge
      uses: matlab-actions/run-command@v3
      with:
        command: |
          addpath(genpath("${{ inputs.tools_directory }}"));
          versionNumberStr = "v${{ inputs.version_number }}";
          if exist("createTestedWithBadgeforToolbox", "file")
            createTestedWithBadgeforToolbox(versionNumberStr);
          else
            matbox.tasks.createTestedWithBadgeforToolbox(versionNumberStr, pwd);
          end
          
    - name: Check if gh-badges branch exists
      id: check_branch
      shell: bash
      run: |
        if git ls-remote --heads origin gh-badges | grep -Fq "refs/heads/gh-badges"; then
          echo "branch_exists=true" >> "$GITHUB_OUTPUT"
          echo "gh-badges branch exists"
        else
          echo "branch_exists=false" >> "$GITHUB_OUTPUT"
          echo "gh-badges branch does not exist"
        fi

    - name: Checkout existing gh-badges branch
      if: steps.check_branch.outputs.branch_exists == 'true'
      uses: actions/checkout@v6
      with:
        ref: gh-badges
        path: gh-badges

    - name: Create gh-badges branch if it doesn't exist
      if: steps.check_branch.outputs.branch_exists == 'false'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        echo "Creating gh-badges branch..."
        mkdir -p gh-badges
        cd gh-badges
        git init
        git remote add origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        git checkout --orphan gh-badges
        
        # Copy initialization files
        cp "$ACTION_PATH"/gh-badges-init/* .
        
        git add .
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -m "Initialize gh-badges branch"
        git push origin gh-badges
        
    - name: Push to gh-badges
      shell: bash
      env:
        VERSION_NUMBER: ${{ inputs.version_number }}
      run: |
        badge_directory="v${VERSION_NUMBER}"
        mkdir -p "gh-badges/.github/badges/$badge_directory"
        cp ".github/badges/$badge_directory/tested_with.json" "gh-badges/.github/badges/$badge_directory/tested_with.json"
        cd gh-badges
                  
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        # Only proceed with commit and push if changes are detected
        git add .github/badges
        if ! git diff --cached --quiet -- .github/badges; then
          git commit -m "Update tested with badge for release"
          git push origin gh-badges
        else
          echo "Nothing to commit"
        fi
