name: 'Build Test Matrix'
description: 'Determine MATLAB versions from toolbox info and build test matrix with Python versions'

inputs:
  tools_directory:
    description: 'Directory containing MLToolboxInfo.json'
    required: false
    default: 'tools'
  matlab_versions:
    description: 'MATLAB versions to test (overrides auto-detection from MLToolboxInfo.json)'
    required: false
    default: '[]'
  python_versions:
    description: 'JSON object mapping MATLAB versions to Python versions (overrides for specific versions only)'
    required: false
    default: '{}'
  include_python:
    description: 'Whether to include Python versions in the test matrix'
    required: false
    default: 'true'

outputs:
  matrix:
    description: 'Test matrix with MATLAB and Python versions'
    value: ${{ steps.build.outputs.matrix }}
  matlab_versions:
    description: 'Determined MATLAB versions array'
    value: ${{ steps.build.outputs.matlab_versions }}

runs:
  using: "composite"
  steps:
    - name: Build test matrix
      id: build
      shell: bash
      # Inputs are passed via environment variables instead of inline ${{ }}
      # interpolation so quotes in input values cannot break the shell script.
      env:
        TOOLS_DIRECTORY: ${{ inputs.tools_directory }}
        MATLAB_VERSIONS: ${{ inputs.matlab_versions }}
        PYTHON_VERSIONS: ${{ inputs.python_versions }}
        INCLUDE_PYTHON: ${{ inputs.include_python }}
      run: |
        latest_matlab_release=$(curl -fsS "https://ssd.mathworks.com/supportfiles/ci/matlab-release/v0/latest")
        if [ -z "$latest_matlab_release" ]; then
          echo "Error: could not determine the latest MATLAB release from the MathWorks API"
          exit 1
        fi
        echo "Latest MATLAB release from MathWorks API: $latest_matlab_release"
        python3 "${{ github.action_path }}/build_matrix.py" \
          --config-file "${{ github.action_path }}/config.json" \
          --toolbox-info-file "$TOOLS_DIRECTORY/MLToolboxInfo.json" \
          --latest-release "$latest_matlab_release" \
          --matlab-versions "$MATLAB_VERSIONS" \
          --python-versions "$PYTHON_VERSIONS" \
          --include-python "$INCLUDE_PYTHON"
