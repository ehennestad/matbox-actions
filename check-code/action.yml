# Should only be used in a job where MATLAB and MatBox is installed in previous steps

name: 'Check code and upload report'
description: 'Analyse code for code issues and upload code issues report to GitHub'

inputs:
  source_directory:
    description: 'Which folder to run the code check on'
    required: false
    default: './src'
  tools_directory:
    description: 'Where the codecheckToolbox function is located'
    required: false
    default: './tools'
  create_badge:
    description: 'Whether to create a badge'
    required: false
    default: 'true'
  segmented_code_issues_badge:
    description: 'Whether to draw the code issues badge with one segment per severity (errors, warnings, info). MatBox versions that write no issue counts keep the single badge.'
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    - name: Check for MATLAB code issues
      uses: matlab-actions/run-command@v3
      if: always()
      env:
        # Ask MatBox to write badge JSON (rendered to SVG below) instead of
        # rendering SVG in MATLAB via pybadges. Ignored by older MatBox
        # versions, which write SVG directly.
        MATBOX_BADGE_FORMAT: json
      with:
        command: |
          addpath(genpath("${{ inputs.tools_directory }}"));
          if exist("codecheckToolbox", "file")
            codecheckToolbox(...
              "FoldersToCheck", "${{ inputs.source_directory }}");
          else
            matbox.tasks.codecheckToolbox(pwd, ...
              "FoldersToCheck", "${{ inputs.source_directory }}", ...
              "CreateBadge", ${{ inputs.create_badge }});
          end

    # MatBox writes badge descriptions as JSON files; render them to SVG with
    # badge-maker (the shields.io reference implementation). Older MatBox
    # versions write SVG badges directly, in which case no JSON exists and
    # this step does nothing.
    - name: Render SVG badges from badge JSON files
      if: ${{ always() && inputs.create_badge == 'true' }}
      shell: bash
      run: |
        shopt -s nullglob
        badgeJsonFiles=(docs/reports/badges/*.json)
        if [ ${#badgeJsonFiles[@]} -eq 0 ]; then
          echo "No badge JSON files found; nothing to render."
          exit 0
        fi
        mkdir -p .github/badges
        for jsonFile in "${badgeJsonFiles[@]}"; do
          name=$(basename "$jsonFile" .json)
          label=$(jq -r '.label' "$jsonFile")
          message=$(jq -r '.message' "$jsonFile")
          color=$(jq -r '.color' "$jsonFile")
          npx --yes --package badge-maker badge "$label" "$message" ":$color" > ".github/badges/${name}.svg"
          echo "Rendered .github/badges/${name}.svg"
        done

    # Redraw the code issues badge from the per-severity counts in its JSON.
    # Without counts (older MatBox) the script leaves the single badge from
    # the previous step in place.
    - name: Render segmented code issues badge
      if: ${{ always() && inputs.create_badge == 'true' && inputs.segmented_code_issues_badge == 'true' }}
      shell: bash
      run: |
        badgeJsonFile=docs/reports/badges/code_issues.json
        if [ ! -f "$badgeJsonFile" ]; then
          echo "No code issues badge JSON found; nothing to render."
          exit 0
        fi
        npm ci --prefix "$GITHUB_ACTION_PATH" --no-audit --no-fund
        node "$GITHUB_ACTION_PATH/render-segmented-badge.mjs" "$badgeJsonFile" .github/badges/code_issues.svg

    - name: Upload SARIF file
      uses: github/codeql-action/upload-sarif@v4
      continue-on-error: true # Will fail for MATLAB release < R2023a
      with:
        sarif_file: docs/reports/code_issues.sarif
