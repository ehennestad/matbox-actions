# Should only be used in a job where MATLAB and MatBox is installed in previous steps

name: 'Run toolbox test suites'
description: 'Run the test suites available for a MATLAB toolbox'

inputs:
  source_directory:
    description: 'Which folder source code is located in (needs to be added to the MATLAB path)'
    default: './src'
  tests_directory:
    description: 'Which folder the test suites are located in'
    default: './tests'
  tools_directory:
    description: 'Where the testToolbox function is located'
    default: './tools'
  report_subdirectory:
    description: 'Subdirectory for test reports (if saving reports for multiple MATLAB releases)'
    default: ''
  create_badge:
    description: 'Whether to create a badge'
    default: 'true'

runs:
  using: "composite"
  steps:
    - name: Run MATLAB test suites
      uses: matlab-actions/run-command@v3
      if: always()
      env:
        # Ask MatBox to write badge JSON (rendered to SVG below) instead of
        # rendering SVG in MATLAB via pybadges. Ignored by older MatBox
        # versions, which write SVG directly.
        MATBOX_BADGE_FORMAT: json
      with:
        command: |
          addpath(genpath("${{ inputs.source_directory }}"));
          addpath(genpath("${{ inputs.tools_directory }}"));
          addpath(genpath("${{ inputs.tests_directory }}"));
          
          testToolboxArgs = { ...
            "SourceFolderName", "${{ inputs.source_directory }}", ...
            "TestsFolderName", "${{ inputs.tests_directory }}", ...
            "ReportSubdirectory", "${{ inputs.report_subdirectory }}", ...
            "CreateBadge", ${{ inputs.create_badge }} ...
            };

          if exist("testToolbox", "file")
            testToolbox(testToolboxArgs{:});
          else
            matbox.tasks.testToolbox(pwd, testToolboxArgs{:});
          end

    # MatBox writes badge descriptions as JSON files; render them to SVG with
    # badge-maker (the shields.io reference implementation). Older MatBox
    # versions write SVG badges directly, in which case no JSON exists and
    # this step does nothing.
    - name: Render SVG badges from badge JSON files
      if: ${{ always() && inputs.create_badge == 'true' }}
      shell: bash
      run: |
        shopt -s nullglob
        badgeJsonFiles=(docs/reports/badges/*.json)
        if [ ${#badgeJsonFiles[@]} -eq 0 ]; then
          echo "No badge JSON files found; nothing to render."
          exit 0
        fi
        mkdir -p .github/badges
        for jsonFile in "${badgeJsonFiles[@]}"; do
          name=$(basename "$jsonFile" .json)
          label=$(jq -r '.label' "$jsonFile")
          message=$(jq -r '.message' "$jsonFile")
          color=$(jq -r '.color' "$jsonFile")
          npx --yes --package badge-maker badge "$label" "$message" ":$color" > ".github/badges/${name}.svg"
          echo "Rendered .github/badges/${name}.svg"
        done

    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        check_name: ${{ inputs.report_subdirectory != '' && format('Test Results ({0})', inputs.report_subdirectory) || 'Test Results' }}
        files: "docs/reports/**/test-results.xml"
