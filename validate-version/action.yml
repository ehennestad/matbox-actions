name: 'Validate Version'
description: 'Validate version number format from tag or input'

inputs:
  version:
    description: 'Version number (for manual triggers)'
    required: false
  bump:
    description: "Bump type ('major', 'minor' or 'patch') used to infer the version from the latest release tag when no explicit version is given (for manual triggers)"
    required: false
  ref_name:
    description: 'GitHub ref name (for tag triggers)'
    required: false

outputs:
  version_number:
    description: 'Validated version number (without v prefix)'
    value: ${{ steps.set_version.outputs.version_number }}
  skip_workflow:
    description: 'Whether to skip the workflow (true if [skip actions] found)'
    value: ${{ steps.check_skip_actions.outputs.skip_workflow }}

runs:
  using: "composite"
  steps:
    - name: Check for [skip actions] in tag annotation
      id: check_skip_actions
      shell: bash
      run: |
        # If triggered by a tag, check the tag annotation message
        if [[ -n "${{ inputs.ref_name }}" ]]; then
          TAG_NAME="${{ inputs.ref_name }}"
          echo "Checking tag annotation for: $TAG_NAME"
          
          # Get the tag annotation message
          TAG_MESSAGE=$(git tag -l --format='%(contents)' "$TAG_NAME" 2>/dev/null || echo "")
          echo "Tag message: '$TAG_MESSAGE'"
          
          if [[ "$TAG_MESSAGE" == *"[skip actions]"* ]]; then
            echo "::notice:: Tag annotation contains [skip actions], skipping workflow."
            echo "skip_workflow=true" >> $GITHUB_OUTPUT
            exit 0
          fi
        fi
        
        echo "skip_workflow=false" >> $GITHUB_OUTPUT
        
    - name: Set version based on trigger type
      id: set_version
      if: steps.check_skip_actions.outputs.skip_workflow != 'true'
      shell: bash
      env:
        INPUT_BUMP: ${{ inputs.bump }}
      run: |
        if [[ -n "${{ inputs.version }}" ]]; then
          # For manual trigger, use the input version
          VERSION_NUMBER="${{ inputs.version }}"
          # Validate format
          if [[ ! "$VERSION_NUMBER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error:: Input for 'version' ('$VERSION_NUMBER') is not in the expected major.minor.patch format."
            exit 1
          fi
        elif [[ -n "$INPUT_BUMP" ]]; then
          # For manual trigger with a bump type, infer the next version from
          # the highest existing release tag. Requires a checkout that fetched
          # tags (e.g. fetch-depth: 0).
          if [[ ! "$INPUT_BUMP" =~ ^(major|minor|patch)$ ]]; then
            echo "::error:: Input for 'bump' ('$INPUT_BUMP') must be one of: major, minor, patch."
            exit 1
          fi
          LATEST_TAG=$(git tag --list | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [[ -z "$LATEST_TAG" ]]; then
            echo "::error:: No existing vMAJOR.MINOR.PATCH tag to bump from. Provide an explicit version instead."
            exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST_TAG#v}"
          case "$INPUT_BUMP" in
            major) VERSION_NUMBER="$((MAJOR + 1)).0.0" ;;
            minor) VERSION_NUMBER="${MAJOR}.$((MINOR + 1)).0" ;;
            patch) VERSION_NUMBER="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          esac
          echo "Latest release tag is ${LATEST_TAG}; ${INPUT_BUMP} bump gives version ${VERSION_NUMBER}"
        else
          # For tag trigger, use the tag name
          TAG_NAME="${{ inputs.ref_name }}"
          # Remove 'v' prefix if present for the version number
          VERSION_NUMBER="${TAG_NAME#v}"
          
          # Validate format
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error:: Tag name ('$TAG_NAME') is not in the expected v*.*.* format."
            exit 1
          fi
        fi
        
        echo "Using version number: $VERSION_NUMBER"
        echo "version_number=$VERSION_NUMBER" >> $GITHUB_OUTPUT
